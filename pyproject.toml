[project]
name = "osm-polygon-sentence-relevance"
version = "0.1.0"
description = "Deterministic sentence-level relevance dataset derived from OSM polygons, Wikipedia, and Wikivoyage sections."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "NoeFlandre" },
]
keywords = [
    "openstreetmap",
    "wikidata",
    "wikipedia",
    "wikivoyage",
    "sentence-segmentation",
    "dataset",
    "deterministic",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = [
    "pyarrow",
]

[project.urls]
Homepage = "https://github.com/NoeFlandre/osm-polygon-wikidata-sentence-relevance"
Repository = "https://github.com/NoeFlandre/osm-polygon-wikidata-sentence-relevance"
Issues = "https://github.com/NoeFlandre/osm-polygon-wikidata-sentence-relevance/issues"
Documentation = "https://github.com/NoeFlandre/osm-polygon-wikidata-sentence-relevance/tree/main/docs"
Changelog = "https://github.com/NoeFlandre/osm-polygon-wikidata-sentence-relevance/blob/main/CHANGELOG.md"

[project.optional-dependencies]
segmentation = [
    # Pinned to the exact version the placement adapter is structurally
    # tested against. The adapter in ``sentences/_wtpsplit_device.py``
    # refuses any other version at runtime so a wider range would only
    # invite a configuration we have not verified. See ``_WTPSPLIT_SUPPORTED_VERSION``
    # in ``sentences/sat.py``.
    "wtpsplit==2.2.1",
    "torch>=2.2,<3",
]
hub = [
    "huggingface_hub>=0.20.0",
    # Profile-rendering dependencies. matplotlib is pinned to a modern
    # 3.8+ baseline for the Agg backend used in tests; numpy is
    # matplotlib's deterministic-seed backbone; pillow handles the
    # PNG verification path in tests.
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pillow>=10.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff>=0.14,<0.15",
    "ty>=0.0.65,<0.1",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
osm_polygon_sentence_relevance = ["py.typed"]

[project.scripts]
osm-polygon-sentence-relevance = "osm_polygon_sentence_relevance.application.cli:main"
osm-polygon-label-sentences = "osm_polygon_sentence_relevance.labeling.cli:main"
osm-polygon-grid5000 = "osm_polygon_sentence_relevance.operator.cli:main"


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=osm_polygon_sentence_relevance --cov=scripts.streaming --cov-branch"
filterwarnings = [
    'ignore:invalid escape sequence.*:SyntaxWarning',
]


[tool.coverage.run]
branch = true
source = ["osm_polygon_sentence_relevance", "scripts.streaming"]
omit = [
    "*/tests/*",
    "src/osm_polygon_sentence_relevance/*/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 95
exclude_lines = [
    # Standard pragma for unreachable defensive branches.
    "pragma: no cover",
    # Defensive branches the type checker or contract gates consider
    # impossible, kept for parity with the legacy renderer.
    "raise NotImplementedError",
    "raise AssertionError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors (correctness)
    "W",    # pycodestyle warnings
    "F",    # Pyflakes: unused imports/variables
    "I",    # isort: import ordering
    "UP",   # pyupgrade: safe modernization
    "B",    # flake8-bugbear: common correctness bugs
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PT",   # flake8-pytest-style
    "RUF100",  # unused-noqa: catches stale or ineffective suppression comments
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["osm_polygon_sentence_relevance"]

[tool.ty.src]
include = [
    "src",
    "scripts/streaming",
    "scripts/grid5000/gpu_preflight.py",
    "scripts/render_assets.py",
    "scripts/verify_distribution.py",
]
